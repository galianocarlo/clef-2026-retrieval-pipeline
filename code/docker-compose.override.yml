version: '3.8'

services:
  pylucene:
    build:
      context: ./pylucene
      dockerfile: Dockerfile
    container_name: clef-pylucene
    ports:                     
      - "8888:8888"            
    volumes:
      - ./notebooks:/app/notebooks
      - ./pylucene/src:/app/src
      - ./experiment:/app/experiment
    stdin_open: true
    tty: true
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]